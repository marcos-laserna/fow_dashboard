<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Series Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>Series Dashboard</h1>
    <span id="status" class="muted">Cargando datos…</span>
  </header>

  <main>
    <aside id="catalog-panel">
      <div class="filters">
        <input id="search" type="search" placeholder="Buscar código o nombre…" aria-label="Buscar series">
        <select id="group" aria-label="Grupo"><option value="">Todos los grupos</option></select>
      </div>
      <div id="catalog-count" class="muted"></div>
      <ul id="catalog" aria-label="Catálogo de series"></ul>
    </aside>

    <section id="workspace">
      <div class="toolbar">
        <label>Transformación
          <select id="transform">
            <option value="level">Nivel</option>
            <option value="pct">% periodo anterior</option>
            <option value="yoy">% interanual</option>
            <option value="diff">Diferencia</option>
            <option value="rebase">Base 100 = inicio</option>
          </select>
        </label>
        <label>Desde <input id="from" type="month"></label>
        <label>Hasta <input id="to" type="month"></label>
        <span class="spacer"></span>
        <button id="dl-csv" type="button">CSV</button>
        <button id="dl-xlsx" type="button">Excel</button>
        <button id="clear" type="button" class="ghost">Limpiar</button>
      </div>

      <div id="selected"></div>
      <div id="chart"></div>
      <p id="empty" class="muted">Selecciona series en el catálogo (máx. 8). Haz clic en el eje de cada serie para pasarla a la derecha.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
