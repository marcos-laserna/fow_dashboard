<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Series Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header class="titlebar">
    <strong>Series Dashboard</strong>
    <span id="status">Cargando datos…</span>
  </header>

  <div class="toolbar">
    <label>Desde <input id="from" type="month"></label>
    <label>Hasta <input id="to" type="month"></label>
    <span class="sep"></span>
    <button id="dl-csv" type="button">Exportar CSV</button>
    <button id="dl-xlsx" type="button">Exportar Excel</button>
    <button id="clear" type="button">Limpiar</button>
  </div>

  <main>
    <aside>
      <div class="pane-title">Bases de datos</div>
      <input id="search" type="search" placeholder="Buscar código o descripción…" aria-label="Buscar series">
      <div id="tree" role="tree" aria-label="Catálogo de series"></div>
      <div id="catalog-count" class="foot"></div>
    </aside>

    <section class="work">
      <div class="pane-title">Series seleccionadas</div>
      <table id="selected">
        <thead><tr>
          <th></th><th>Código</th><th>Descripción</th><th>Frec.</th><th>Inicio</th><th>Fin</th>
          <th class="num">Último</th><th>Tasas oficiales</th><th>Ajuste</th><th>Mostrado como</th><th>Eje</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <p id="empty">Marca series en el árbol de la izquierda (máx. 8).</p>

      <div class="viewbar">
        <div class="vgroup"><span class="vlabel">Mostrar como</span>
          <span class="seg multi" id="transform-seg" title="Puedes marcar varias a la vez">
            <button type="button" data-t="level">Nivel</button>
            <button type="button" data-t="pct">% vs. periodo anterior</button>
            <button type="button" data-t="yoy">% interanual</button>
            <button type="button" data-t="ytd" title="Solo si la fuente la publica">% acum. año</button>
            <button type="button" data-t="diff">Diferencia</button>
            <button type="button" data-t="rebase">Base 100</button>
          </span>
          <span class="muted small">(varias a la vez)</span>
        </div>
        <div class="vgroup"><span class="vlabel">Ajuste estacional</span>
          <span class="seg" id="adjust-seg">
            <button type="button" data-adj="" title="Catálogo con todas las versiones publicadas">Todas</button>
            <button type="button" data-adj="nsa" title="Serie original publicada">Original</button>
            <button type="button" data-adj="cal" title="Corregida de efectos de calendario">Corr. calendario</button>
            <button type="button" data-adj="sa" title="Corregida de efectos estacionales y de calendario">Desestacionalizada</button>
          </span>
        </div>
        <div class="vgroup"><span class="vlabel">Ejes</span>
          <span class="seg" id="axis-seg">
            <button type="button" data-dual="1" title="Niveles a la izquierda y variaciones a la derecha; también separa series de escalas muy distintas">Doble automático</button>
            <button type="button" data-dual="0" title="Todas las series en el eje izquierdo (salvo las fijadas a la derecha)">Uno solo</button>
          </span>
        </div>
        <div id="view-hint"></div>
      </div>

      <div class="chart-box">
        <div id="chart-title"></div>
        <div id="chart-sub"></div>
        <div id="chart"></div>
        <div id="chart-source"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
