name: Ingest data

on:
  workflow_dispatch:
  schedule:
    # Check once per day. The INE publishes this indicator monthly.
    - cron: "17 6 * * *"
  push:
    paths:
      - "data/manual/**"
      - "data/series.json"
      - "ingest.py"
      - "requirements.txt"
      - ".github/workflows/ingest.yml"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download INE data and ingest manual files
        run: python ingest.py
      - name: Save updated dataset
        run: |
          if [[ -n "$(git status --porcelain data/processed)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/processed/observations.csv
            git commit -m "Update ingested data"
            git push
          fi
