name: Build Drive processing dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/drive_processing/drive_data/**"
      - "site/drive_processing/manual_csv/**"
      - "site/drive_processing/*.py"
      - "site/drive_processing/template.html"
      - ".github/workflows/drive-processing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drive-processing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Rebuild data artifacts
        working-directory: site/drive_processing
        run: |
          if [ -f drive_data/high_frequency/alta_frecuencia.xlsx ]; then
            python importar_bigdata.py drive_data/high_frequency/alta_frecuencia.xlsx
          fi
          if [ -f drive_data/bigdata/Tabla_monitor.csv ]; then
            python importar_tabla_monitor.py
          fi
          if [ -f drive_data/bigdata/Datos_informe.csv ]; then
            python importar_bigdata_drive.py
          fi
          if [ -f bigdata_geo/index.json ] || [ -f drive_data/bigdata/Tabla_monitor.csv ]; then
            python generar_heatmap.py
          fi
          python build_page.py
          cp espana.html index.html
      - name: Commit generated dashboard
        id: generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/drive_processing/{bigdata.json,bigdata_heatmap.json,espana.html,artifact.html,index.html}
          if [ -d site/drive_processing/bigdata_geo ]; then
            git add -A site/drive_processing/bigdata_geo/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Build Drive processing dashboard"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish generated dashboard
        if: steps.generated.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
