name: Build Drive processing dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/drive_processing/drive_data/**"
      - "site/drive_processing/manual_csv/**"
      - ".github/workflows/drive-processing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-processing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Rebuild data artifacts
        working-directory: site/drive_processing
        run: |
          if [ -f drive_data/high_frequency/alta_frecuencia.xlsx ]; then
            python importar_bigdata.py drive_data/high_frequency/alta_frecuencia.xlsx
          fi
          if [ -f drive_data/bigdata/Datos_informe.csv ]; then
            python importar_bigdata_drive.py
            python generar_heatmap.py
          fi
          python build_page.py
          cp espana.html index.html
      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/drive_processing/
          if ! git diff --cached --quiet; then
            git commit -m "Build Drive processing dashboard"
            git push origin HEAD:main
          fi
