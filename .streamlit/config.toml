[theme]
# Same tokens as site/style.css (Haver-style: white, thin grey rules, navy accent).
base = "light"
primaryColor = "#0b2e6b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#111111"
font = "'Segoe UI', Tahoma, Arial, sans-serif"
baseFontSize = 13
baseRadius = "2px"
buttonRadius = "2px"
borderColor = "#c9ced6"
dataframeBorderColor = "#e4e7ec"
dataframeHeaderBackgroundColor = "#fafbfc"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
